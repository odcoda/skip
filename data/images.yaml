SCP-682:
  images:
    - filename: Monster8.jpg
      url: https://static.wikia.nocookie.net/cryptidz/images/9/93/Monster8.jpg
      caption: "SCP-682 (original image: Sakhalin Island Sea Wolf)"
      location: originals/
      original: true
    - filename: monster8editub9-new.jpg
      url: http://scp-wiki.wdfiles.com/local--files/scp-682/monster8editub9-new.jpg
      caption: SCP-682 shortly after escaping from containment, still recovering from acid immersion
      license: CC BY-SA 3.0 (derivative by OccultistMave, original by Paxson Woelber CC BY 2.0)
      notes: |
        CURRENT IMAGE is a derivative of "Beached humpback whale at Kincaid Park,
        Anchorage, Alaska" by Paxson Woelber (Flickr, CC BY 2.0), edited by OccultistMave.
        This is the wiki's current properly-licensed replacement.
        ORIGINAL IMAGE was a photo of the "Sakhalin Island Sea Wolf" - a decomposed
        beluga whale carcass found by Russian soldiers on Sakhalin Island in 2006.
        The Sakhalin photos were first posted on Argentinian sci-fi site Axxon (Aug 16, 2006),
        then translated on Cryptomundo (Aug 17, 2006), then English Russia (Aug 28, 2006).
        The original photo had no clear license/attribution and was replaced.
        Sakhalin photos still available on Cryptid Wiki:
          https://cryptidz.fandom.com/wiki/Sakhalin_Island_Sea_Wolf
        Individual Sakhalin carcass photos (from Cryptid Wiki):
          https://static.wikia.nocookie.net/cryptidz/images/4/46/Monster1s.jpg
          https://static.wikia.nocookie.net/cryptidz/images/3/34/Monster9.jpg
          https://static.wikia.nocookie.net/cryptidz/images/e/e1/Monster14.jpg
          https://static.wikia.nocookie.net/cryptidz/images/2/2a/Monster17.jpg
          https://static.wikia.nocookie.net/cryptidz/images/4/40/Monster2.jpg
          https://static.wikia.nocookie.net/cryptidz/images/2/26/MonsterM.jpg
          https://static.wikia.nocookie.net/cryptidz/images/e/e6/Monster3.jpg
          https://static.wikia.nocookie.net/cryptidz/images/f/f4/Monster16.jpg
          https://static.wikia.nocookie.net/cryptidz/images/9/93/Monster8.jpg
        The carcass was ~15 feet long, 4 feet wide, with a beak-like mouth and
        shaggy "hair" (decomposed blubber). Identified as a male beluga whale.

