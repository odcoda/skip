SCP-173:
  images:
    - filename: untitled_2004_museum.jpg
      url: https://payload.cargocollective.com/1/9/319203/4868950/IK_2004_view_Mito_1_879.jpg
      caption: SCP-173
      location: originals/
      notes: |
        ORIGINAL IMAGE REMOVED (February 2022) - was a photo of "Untitled 2004",
        a wood/acrylic/charcoal sculpture (205x56x52cm) by Japanese artist Izumi Kato.
        Photo by Keisuke Yamamoto, courtesy of SCAI The Bathhouse gallery (Tokyo).
        Kato gave reluctant non-commercial permission but was unhappy with the association.
        SCP wiki removed it voluntarily; Kato did not demand removal.
        Original author (Wesley Williams) requested no replacement image be added.
        Artist's official page: https://izumikato.com/Untitled-2004
        Museum photo (by Tuyoshi Saito): https://payload.cargocollective.com/1/9/319203/4868950/IK_2004_view_Mito_1_879.jpg
        Gallery exhibit (by Keisuke Yamamoto): see SCAI The Bathhouse archives
        Artsy listing: https://www.artsy.net/artwork/izumi-kato-untitled-170
        Wikipedia: https://en.wikipedia.org/wiki/Untitled_(2004)
        NOT licensed for commercial use or CC. Personal reference only.

