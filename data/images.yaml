# Image Index for SCP Articles
#
# This file tracks images associated with each SCP article.
# Images are downloaded and stored in output/images/
#
# For some SCPs (173, 682, 914, 882), the original iconic images cannot be
# included due to copyright/licensing. These entries note where to find
# replacement images.
#
# Format:
#   SCP-XXX:
#     images:
#       - filename: image filename from wikidot
#         url: download URL (if available)
#         caption: image caption
#         notes: licensing issues, replacement needed, etc.

SCP-055:
  images: []
  notes: No images (part of the joke - you can't remember it)

