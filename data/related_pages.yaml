# Related Pages Index
#
# This file tracks which supplementary pages should be included with each SCP article.
#
# Guidelines (from GOALS.md):
#   INCLUDE: experiment logs, exploration logs, destruction attempts
#   EXCLUDE: cross-links to other SCPs, lists, stories (usually), hubs, tag pages
#
# Format:
#   SCP-XXX:
#     include:
#       - page-name: reason for inclusion
#     exclude:
#       - page-name: reason for exclusion
#     notes: any special considerations
#
# Status: reviewed = manually verified, pending = needs human review

